<main class="resetPasswordMask">
   <div class="resetPasswordWithEmail">
        <div class="resetHeader">
            <img src="./icons/backButton_black.svg">
            <p>Passwort vergessen?</p>
        </div>
        <span>Bitte gib deine E-Mail-Adresse ein</span>
        <form class="emailWrapper" [formGroup]="resetPasswordGroup">
            <img src="./icons/email_Icon.svg">
            <input (input)="validateEmail()" type="email" id="email" placeholder="beispielname@gmail.com" formControlName="email">
        </form>
        <span>Wir senden Ihnen eine Email, über die<br> Sie Ihr Passwort zurücksetzen können</span>
        <div class="buttonArea">
            <button (click)="catchEmailAndSendResetLink(this.input)" [disabled]="this.disableButton" type="text">Email senden</button>
        </div>
    </div> 
</main>
