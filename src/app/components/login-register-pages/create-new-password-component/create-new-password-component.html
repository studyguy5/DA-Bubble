<main class="createNewPasswordWrapper">
    <div class="createNewPassword">
        <div class="resetHeader">
            <img src="./icons/backButton_black.svg">
            <p>Passwort zurücksetzen</p>
        </div>
        <form class="passwordWrapper" [formGroup]="resetPasswordGroup">
            <input (input)="checkNewPasswort()" type="password" id="password" placeholder="neues Passwort..." formControlName="password">
        </form>
        <form class="passwordWrapper" [formGroup]="resetPasswordGroup">

            <input (input)="checkNewPasswort()"  type="password" id="password-confirm" placeholder="neues Passwort bestätigen..." formControlName="passwordConfirm">
        </form>
        <div class="buttonArea">
            <button [disabled]="!this.passwordfilled"  type="text">Passwort ändern</button>
        </div>

    </div>
</main>
