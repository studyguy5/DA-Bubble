
<div class="topLayerChatbox">
    <div class="headerSearchBarAndProfileArea">
        <img src="./images/dabubble_logo.svg">
        <div class="searchBar">
            <input (input)="searchForTextMessagesInChannelsAndPrivateMessages()" type="text" placeholder="Dev-Space durchsuchen" id="devSearch">
            <img src="./icons/search-Icon.svg">
        </div>
        <div #profileLogoutMiniMenu (click)="openProfileLogoutMiniMenu()" class="profileAndSettings">
            @if(currentUser && currentUser !== null && currentUser !== 'null') {
                {{ currentUser }}
            }@else {
                {{'Guest'}}
            }
                
            
            <p></p>
            <img src="./images/profileImageExample.svg">
            <img src="./icons/settingsArrowDown.svg">
            <img src="/icons/arrowDownLila.svg">
        </div>
    </div>
    <div class="mainChatArea">
        <app-channel-user-selection-component (selectedChannel)="getChoiceFromChannelSelectionComponent($any($event))" 
        (selectedUser)="getChoiceFromSelectionComponent($any($event))"></app-channel-user-selection-component>
    
        <app-direct-messages-component mode="main" [allMessagesForSearching]="$any(messagesForSearching())" [selectedChannel]="$any(selectedChannel())" 
        [selectedUser]="$any(selectedUser())" (openthreadsComponent)="openthreadsComponent.set($event)" [selectUserFromDialog]="selectUserFromDialog.bind(this)" style="flex: 1; display:flex"></app-direct-messages-component>
        <!-- <app-direct-messages-component style="flex: 1; display:flex"></app-direct-messages-component> -->
        <!-- <app-user-threads-component></app-user-threads-component> -->
        <app-direct-messages-component mode="thread" 
        [threadsComponent]="threadsComponent()" [selectedChannel]="$any(selectedChannel())" [selectedUser]="$any(selectedUser())" 
        [class.threadsComponentActive]="openthreadsComponent()" (openthreadsComponent)="openthreadsComponent.set($event)"  [selectUserFromDialog]="selectUserFromDialog.bind(this)" ></app-direct-messages-component> 

    </div>
</div>
