@if(data){

<div class="profileOverviewWrapper">
    <div class="profileOverviewHeader">
        <p>Profil</p>
        <img src="./icons/blackCloseIcon.svg" (click)="closeDialog()">
    </div>
    <div class="profileOverviewContent">
        <img [src]="data.channel.find(user => user.uuid == data.member)?.avatar_url">
        <div class="UserNameAndstatus">
            <p><b>{{data.channel.find(user => user.uuid == data.member)?.username}}</b></p>
            <div class="statuswrapper">
                <img [src]="data.channel.find(user => user.uuid == data.member)?.activity_status === true ? this.status_online : this.status_offline"><p>{{data.channel.find(user => user.uuid == data.member)?.activity_status === true ? 'Aktiv' : 'Abwesend'}}</p>
            </div>
        </div>
        <div class="emailWrapper">
            <div class="EmailHeader">
                <p><img src="./icons/mailIconBlack.svg"></p>
                <p><b>E-Mail-Adresse</b></p>
            </div>
            <p>{{data.channel.email}}</p>
        </div>
    </div>
    <button (click)="openDirektMessageWithThisUser(data)">Nachricht senden</button>
</div>

}
